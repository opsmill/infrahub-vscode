---
# yamllint disable rule:truthy
name: Publish release

# The reviewed release PR merges first. Its tag starts the existing
# publish.yml workflow, which publishes the extension and GitHub Release.
on:
  push:
    branches: [main]

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Tag the reviewed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tag a merged release pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null)
                      | .head.ref
                      | select(startswith("release/v"))] | first // empty'
          )
          if [ -z "${BRANCH}" ]; then
            echo "No merged release/v* pull request; nothing to publish."
            exit 0
          fi

          VERSION="${BRANCH#release/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Release PR branch and package.json version disagree."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already tagged."
            exit 0
          fi
          if ! grep -Fq "tree/v${VERSION}" CHANGELOG.md; then
            echo "::error::No CHANGELOG section for v${VERSION}."
            exit 1
          fi

          git config user.name "opsmill-bot"
          git config user.email "opsmill-bot@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
